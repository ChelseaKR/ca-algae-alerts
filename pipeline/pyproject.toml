[project]
name = "caalgae"
version = "0.1.0"
description = "California freshwater harmful-algal-bloom advisories: discover, fetch, normalize, history, snapshot, static site."
readme = "README.md"
authors = [
    { name = "Chelsea Kelly-Reif (she/her)", email = "3114598+ChelseaKR@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "jinja2>=3.1",
]

[project.scripts]
caalgae = "caalgae.cli:main"

# CODE-QUALITY-STANDARD §2 (CQ-10): hatchling. `make build` builds the wheel,
# so a template that stops shipping fails there.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caalgae"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.15.0",
    "mypy>=1.18",
    "types-jsonschema>=4.23",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "RUF"]
ignore = ["E501"]            # line length owned by the formatter
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "slow: > 2s",
    "integration: requires an external service",
    "smoke: critical path",
]

[tool.coverage.run]
branch = true
source = ["src"]
[tool.coverage.report]
fail_under = 90
show_missing = true
