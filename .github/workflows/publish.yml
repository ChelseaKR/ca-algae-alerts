name: publish

# Live fetch -> history -> snapshot -> site, daily at 14:41 UTC.
#
# The schedule is inert until the owner sets the repository variable
# PAGES_ENABLED=true: a scheduled run is skipped while it is unset, so the
# schedule alone commits nothing and deploys nothing. A manual dispatch always
# runs the pipeline, commits history if it changed, and, with PAGES_ENABLED
# unset, uploads the built site as a run artifact for review and deploys
# nothing. The owner's order of steps is docs/DOMAIN.md.
#
# Why 14:41 UTC: GitHub cron is UTC and ignores daylight saving. 14:41 UTC is
# 07:41 PDT now (after the state's overnight republish; a non-zero minute
# avoids the busiest slot) and becomes 06:41 PST when clocks fall back on
# 2026-11-01. The site goes live after that, so it runs at 06:41 PST in
# winter. Before launch, check the state's overnight republish time once; if
# it is later than 06:41, change the hour to 15 (07:41 PST, 08:41 PDT).
#
# A refused or failed run (page reshaped, file older than the last run,
# truncated file, schema violation) exits non-zero before anything is
# committed or uploaded.

on:
  schedule:
    - cron: "41 14 * * *"
  workflow_dispatch:
    inputs:
      allow_page_drop:
        # A deliberate drop of a state's pages (say "MO"), which the publish
        # guard otherwise refuses (docs/DECISIONS.md 0024). Empty: no override.
        description: "State codes whose pages may drop this run, such as MO (blank for none)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # A scheduled run does nothing until PAGES_ENABLED is true; a manual run
    # always goes ahead.
    if: github.event_name != 'schedule' || vars.PAGES_ENABLED == 'true'
    # Hosted on purpose: this job commits to main and builds what gets
    # deployed, so it never runs on a shared self-hosted runner or reuses a
    # dependency cache (CI-CD-STANDARD §8c).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      guard_reason: ${{ steps.guard.outputs.reason }}
      unavailable: ${{ steps.guard.outputs.unavailable }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks

      - name: install dependencies
        working-directory: pipeline
        run: uv sync --locked

      - name: run the pipeline (live fetch -> history -> snapshot -> site)
        working-directory: pipeline
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
        run: |
          uv run caalgae --site-out ../site \
            --base-url "$SITE_BASE_URL" \
            --support-email "$SUPPORT_EMAIL" \
            --app-store-url "$APP_STORE_URL"

      - name: guard against a silent drop of a state's pages
        # Before the history commit and the Pages upload: a refusal leaves
        # yesterday's site live and opens the publish-failure issue. It
        # compares this build's sitemap with the live one, state by state,
        # and fails when a state loses all, or more than 20%, of its pages
        # without being switched off or named in allow_page_drop
        # (pipeline/src/caalgae/publish_guard.py, docs/DECISIONS.md 0024).
        id: guard
        if: vars.PAGES_ENABLED == 'true' && vars.SITE_BASE_URL != ''
        working-directory: pipeline
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          ALLOW_PAGE_DROP: ${{ inputs.allow_page_drop }}
        run: |
          set -euo pipefail
          uv run python -m caalgae.publish_guard --site-dir ../site \
            --base-url "$SITE_BASE_URL" --allow "$ALLOW_PAGE_DROP"

      - name: commit updated history, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/history.json
          if git diff --cached --quiet; then
            echo "no change to history this run"
          else
            "$RUNNER_TEMP/bin/gitleaks" git --pre-commit --staged \
              --redact --no-banner --exit-code 1 .
            git commit -m "data: pipeline run $(date -u +%Y-%m-%dT%H:%MZ)"
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              push origin HEAD:main
          fi

      - name: upload the site for review (Pages off)
        if: vars.PAGES_ENABLED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site
          retention-days: 7

      - name: pick the pages to announce to IndexNow
        # Runs BEFORE the deploy replaces the live site, because the previous
        # deploy's sitemap.xml is what this build is compared with: a page is
        # announced when it is new or its <lastmod> changed. Only https URLs on
        # lakenotice.com, only built pages without a robots noindex, at most
        # 10,000. Selection only: nothing is sent here. indexnow.py is stdlib
        # only and exits 0 on any problem (a notice, never a failed run), so
        # no continue-on-error, which the portfolio standards ban. No secret:
        # the key is public by design (pipeline/src/caalgae/indexnow.py).
        if: vars.PAGES_ENABLED == 'true' && vars.SITE_BASE_URL != ''
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          set -euo pipefail
          python3 pipeline/src/caalgae/indexnow.py select \
            --site-dir site --base-url "${SITE_BASE_URL%/}" \
            --kind sitemap --file sitemap.xml --missing-is-empty \
            --out "$RUNNER_TEMP/indexnow-urls.json"

      - name: keep the IndexNow list for the job after the deploy
        if: vars.PAGES_ENABLED == 'true' && vars.SITE_BASE_URL != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexnow-urls
          path: ${{ runner.temp }}/indexnow-urls.json
          retention-days: 1
          if-no-files-found: warn

      - name: upload the site as a Pages artifact
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Tell IndexNow which pages are new or changed, only after the deploy
  # succeeded (a skipped or failed deploy skips this job). Never fails the
  # run: indexnow.py exits 0 on any problem and prints a notice, and the
  # sitemap still gets the pages crawled. Not part of alert-on-failure, so a
  # refused ping never opens an issue. https://www.indexnow.org/documentation
  indexnow:
    needs: deploy
    if: vars.SITE_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: fetch the list the build selected
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow-urls
          path: ${{ runner.temp }}/indexnow

      - name: announce the new and changed pages to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          python3 pipeline/src/caalgae/indexnow.py submit --list "$RUNNER_TEMP/indexnow/indexnow-urls.json"

  alert-on-failure:
    needs: [build, deploy]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or update the publish-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GUARD_REASON: ${{ needs.build.outputs.guard_reason }}
        run: |
          set -euo pipefail
          title="publish: the pipeline run failed"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")"
          body="The publish workflow did not finish. Nothing from this run was committed or deployed. Run: ${RUN_URL}"
          if [ -n "${GUARD_REASON}" ]; then
            body="${body} Publish guard: ${GUARD_REASON}"
          fi
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}" --label bug
          fi

  # A state in its "data unavailable" mode still deploys (its pages stay up,
  # dated), but the owner hears about it the same day (DECISIONS 0024).
  notice-unavailable:
    needs: build
    if: needs.build.outputs.unavailable != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or update the data-unavailable issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UNAVAILABLE: ${{ needs.build.outputs.unavailable }}
        run: |
          set -euo pipefail
          title="publish: a state's data is unavailable"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")"
          body="${UNAVAILABLE}. Its pages stay up with a dated notice and no status. Run: ${RUN_URL}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}" --label bug
          fi
