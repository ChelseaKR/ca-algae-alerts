name: publish

# Live fetch -> history -> snapshot -> site. MANUAL ONLY for now: GitHub
# Pages is off until the owner decides on Pages and a domain (Pages on a
# private repository may be billable). When she turns it on:
#   1. add `schedule: - cron: "41 14 * * *"` below (07:41 PDT, after the
#      state's overnight republish; a non-zero minute avoids the busiest slot);
#   2. set the repository variable PAGES_ENABLED=true.
# Until then a dispatch runs the pipeline, commits history if it changed, and
# uploads the built site as a run artifact for review. Nothing is deployed.
#
# A refused or failed run (page reshaped, file older than the last run,
# truncated file, schema violation) exits non-zero before anything is
# committed or uploaded.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # Hosted on purpose: this job commits to main and builds what gets
    # deployed, so it never runs on a shared self-hosted runner or reuses a
    # dependency cache (CI-CD-STANDARD §8c).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: install pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks

      - name: install dependencies
        working-directory: pipeline
        run: uv sync --locked

      - name: run the pipeline (live fetch -> history -> snapshot -> site)
        working-directory: pipeline
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
        run: |
          uv run caalgae --site-out ../site \
            --base-url "$SITE_BASE_URL" \
            --support-email "$SUPPORT_EMAIL" \
            --app-store-url "$APP_STORE_URL"

      - name: commit updated history, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/history.json
          if git diff --cached --quiet; then
            echo "no change to history this run"
          else
            "$RUNNER_TEMP/bin/gitleaks" git --pre-commit --staged \
              --redact --no-banner --exit-code 1 .
            git commit -m "data: pipeline run $(date -u +%Y-%m-%dT%H:%MZ)"
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              push origin HEAD:main
          fi

      - name: upload the site for review (Pages off)
        if: vars.PAGES_ENABLED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site
          retention-days: 7

      - name: upload the site as a Pages artifact
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  alert-on-failure:
    needs: [build, deploy]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: open or update the publish-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="publish: the pipeline run failed"
          existing="$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"${title}\")][0].number // empty")"
          body="The publish workflow did not finish. Nothing from this run was committed or deployed. Run: ${RUN_URL}"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}" --label bug
          fi
